name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: swift test --package-path KinwallKit
      - run: CI=1 npx expo prebuild --clean --no-install

  android-native:
    # No release environment, Firebase client config, signing keys or store upload.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: npm ci --ignore-scripts
      - run: CI=1 npx expo prebuild --platform android --clean --no-install
      - name: Run native Android unit tests (including PushGatewayTest)
        working-directory: android
        run: ./gradlew :kinwall-native:testReleaseUnitTest
      - name: Require the gateway tests to execute
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path('modules/kinwall-native/android/build/test-results/testReleaseUnitTest/TEST-family.kinwall.nativemodule.PushGatewayTest.xml')
          suite = ET.parse(report).getroot()
          cases = suite.findall('testcase')
          assert len(cases) >= 3, 'PushGatewayTest did not execute its cryptographic and malformed-input tests'
          assert all(case.find(tag) is None for case in cases for tag in ('skipped', 'failure', 'error')), 'Gateway tests failed or were skipped'
          PY
      - name: Save native test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-native-test-reports
          path: |
            modules/kinwall-native/android/build/test-results/testReleaseUnitTest/
            modules/kinwall-native/android/build/reports/tests/testReleaseUnitTest/
          if-no-files-found: error
