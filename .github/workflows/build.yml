# Unsigned app builds (README "Install a test build"). Called by release-please.yml when a release
# is made, which attaches them to it with SHA256SUMS.txt; or run by hand: with a tag it builds that
# release and attaches (or replaces) its files, without one it builds the chosen branch and keeps
# the files as this run's artifacts. Nothing is signed with a real key, so no secrets.
# Build numbers: iOS buildNumber and Android versionCode are major*10000 + minor*100 + patch
# (0.2.0 -> 200), passed to app.config.js as KINWALL_BUILD_NUMBER.
name: App builds
on:
  workflow_call:
    inputs:
      tag: { type: string, required: true }
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (vX.Y.Z). Empty for a test build of the branch.
        type: string
        required: false
permissions: {}
defaults:
  run:
    shell: bash
env:
  TAG: ${{ inputs.tag }}
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.v.outputs.name }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ inputs.tag }}', persist-credentials: false }
      - id: v
        run: |
          v=$(node -p "require('./package.json').version")
          IFS=. read -r major minor patch <<< "$v"
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then echo "::error::$v: minor and patch must stay under 100 for the build number rule"; exit 1; fi
          if [ -n "$TAG" ] && [ "$TAG" != "v$v" ]; then echo "::error::tag $TAG but package.json says $v"; exit 1; fi
          echo "build=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"
          echo "name=$v$([ -n "$TAG" ] || echo "-${GITHUB_SHA::7}")" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      KINWALL_BUILD_NUMBER: ${{ needs.version.outputs.build }}
      NAME: kinwall-${{ needs.version.outputs.name }}-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ inputs.tag }}', persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - run: npm ci
      - run: CI=1 npx expo prebuild --platform android --clean
      - name: Build the release APK, unsigned
        working-directory: android
        run: |
          # The template signs release builds with its debug.keystore, which is public. Drop it (the
          # APK comes out as app-release-unsigned.apk, or the copy below fails) and sign after.
          perl -0pi -e 's/(release \{.*?)\n\s*signingConfig signingConfigs\.debug\n/$1\n/s' app/build.gradle
          ./gradlew assembleRelease
      - name: Sign a copy with a throwaway key
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "out/$NAME-unsigned.apk"
          pass=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -storepass "$pass" -alias kinwall \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Kinwall test build"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" sign --v4-signing-enabled false --ks "$RUNNER_TEMP/throwaway.jks" --ks-pass "pass:$pass" --out "out/$NAME.apk" "out/$NAME-unsigned.apk"
          "$apksigner" verify "out/$NAME.apk"
          rm "$RUNNER_TEMP/throwaway.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: '${{ env.NAME }}', path: out/, if-no-files-found: error }

  ios:
    needs: version
    # Xcode 26 or later: the iOS 17 deployment target, the widgets and the Watch app.
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      KINWALL_BUILD_NUMBER: ${{ needs.version.outputs.build }}
      NAME: kinwall-${{ needs.version.outputs.name }}-ios
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      # No push entitlement: nothing here is signed by a paid team (docs/PLAN.md).
      KINWALL_PUSH: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ inputs.tag }}', persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: CI=1 npx expo prebuild --platform ios --clean --no-install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pods-${{ runner.os }}-
      - run: xcodebuild -version && (xcodebuild -showsdks | grep -q watchos || xcodebuild -downloadPlatform watchOS)
      - run: pod install
        working-directory: ios
      - name: Build for iPhone and iPad, unsigned
        run: |
          xcodebuild build -quiet -workspace ios/Kinwall.xcworkspace -scheme Kinwall -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package the IPA
        run: |
          app="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Kinwall.app"
          for part in PlugIns/KinwallWidgets.appex PlugIns/KinwallShare.appex Watch/KinwallWatch.app Watch/KinwallWatch.app/PlugIns/KinwallWatchWidgets.appex; do
            [ -d "$app/$part" ] || { echo "::error::Kinwall.app has no $part"; exit 1; }
          done
          mkdir -p out "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/out/$NAME-unsigned.ipa" Payload)
      - name: Build for the Simulator
        run: |
          xcodebuild build -quiet -workspace ios/Kinwall.xcworkspace -scheme Kinwall -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          (cd "$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator" && ditto -c -k --keepParent Kinwall.app "$GITHUB_WORKSPACE/out/$NAME-simulator.app.zip")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: '${{ env.NAME }}', path: out/, if-no-files-found: error }

  release:
    needs: [version, android, ios]
    if: ${{ inputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      V: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: out, merge-multiple: true }
      - working-directory: out
        run: sha256sum kinwall-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - run: gh release upload "$TAG" out/* --clobber
      - name: Add install notes to the release
        run: |
          body=$(gh release view "$TAG" --json body -q .body)
          if grep -q '^## Install a test build' <<< "$body"; then exit 0; fi
          cat > notes.md <<NOTES
          $body

          ## Install a test build

          Kinwall isn't in the app stores yet. These builds are for trying it on your own devices; see the README's [Install a test build](https://github.com/$GH_REPO#install-a-test-build).

          - **kinwall-$V-android.apk**: Android phones and tablets. Open it on the device and allow installing from your browser or file manager when asked. It's signed with a key made for this build only, so it can't update, or be updated by, any other build: an earlier release, your own build, or a future Play Store version. Uninstall the old one first, then sign in again.
          - **kinwall-$V-android-unsigned.apk**: the same build, unsigned, to sign with your own key (\`apksigner\`). Android won't install it as is.
          - **kinwall-$V-ios-unsigned.ipa**: iPhone and iPad, with the widgets, the share extension and the Watch app inside. It won't install until it's signed: sign it (and the extensions inside) with your own Apple ID in a re-signing tool, or build from source with Xcode (README). A free Apple ID's signature lasts 7 days. Push notifications and Live Activity push don't work in these builds; the Live Activities the app starts itself do.
          - **kinwall-$V-ios-simulator.app.zip**: for the iOS Simulator in Xcode. Unzip it, then \`xcrun simctl install booted Kinwall.app\`.
          - **SHA256SUMS.txt**: checksums, for \`sha256sum -c SHA256SUMS.txt\`.
          NOTES
          gh release edit "$TAG" --notes-file notes.md
