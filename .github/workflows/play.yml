# Signed Android App Bundle uploaded to Google Play's internal testing track (docs/PUBLISHING.md),
# built by scripts/play-bundle.sh like a hand build. Called by release-please.yml for each release,
# or run by hand: with a tag it uploads that release, without one the chosen branch.
# Skipped until these repository secrets exist:
#   ANDROID_UPLOAD_KEYSTORE   the upload key, base64:  base64 -i ~/.kinwall/kinwall-upload.jks | gh secret set ANDROID_UPLOAD_KEYSTORE
#   ANDROID_UPLOAD_PASSWORD   its password
#   PLAY_SERVICE_ACCOUNT_JSON a Google Cloud service account's JSON key, invited in Play Console ->
#                             Users and permissions with release rights for Kinwall
# Releases go up as drafts (Play only takes drafts until the app's first release is reviewed);
# set the repository variable PLAY_RELEASE_STATUS to "completed" after that to roll out directly.
# Version codes are minutes since 1970, as in scripts/play-bundle.sh, so CI and hand builds always go up.
name: Google Play
on:
  workflow_call:
    inputs:
      tag: { type: string, required: true }
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload (vX.Y.Z). Empty to upload the chosen branch.
        type: string
        required: false
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.s.outputs.ready }}
    steps:
      - id: s
        env:
          KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          PASS: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$KEY" ] && [ -n "$PASS" ] && [ -n "$PLAY" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Google Play skipped: the upload key and Play secrets aren't set yet (see play.yml)"; fi

  upload:
    needs: check
    if: ${{ needs.check.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    # The upload key is written and its password put in the environment only for the build step,
    # after npm has installed, so dependency install code never sees them.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: '${{ inputs.tag }}', persist-credentials: false }
      - name: Check the tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          if [ -n "$TAG" ] && [ "$TAG" != "v$v" ]; then echo "::error::tag $TAG but package.json says $v"; exit 1; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - run: npm ci --ignore-scripts # no dependency has an install script; this keeps it that way
      - name: Upload key
        env:
          KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          umask 077
          printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build the signed bundle
        env:
          KEYSTORE: ${{ runner.temp }}/upload.jks
          KINWALL_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          OUT: ${{ runner.temp }}/kinwall.aab
          NPM_CI: '0'
        run: scripts/play-bundle.sh
      - if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: family.kinwall.app
          releaseFiles: ${{ runner.temp }}/kinwall.aab
          releaseName: ${{ inputs.tag || github.sha }}
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
