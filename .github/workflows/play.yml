# Signed Android App Bundle uploaded to a Google Play testing track (docs/PUBLISHING.md),
# built by scripts/play-bundle.sh like a hand build. Called by release-please.yml for each release,
# or run by hand: with a tag it uploads that release, without one the chosen branch.
# Skipped until these secrets exist (repository secrets, or secrets of the "release" environment):
#   ANDROID_UPLOAD_KEYSTORE   the upload key, base64:  base64 -i ~/.kinwall/kinwall-upload.jks | gh secret set ANDROID_UPLOAD_KEYSTORE
#   ANDROID_UPLOAD_PASSWORD   its password
#   PLAY_SERVICE_ACCOUNT_JSON a Google Cloud service account's JSON key, invited in Play Console ->
#                             Users and permissions with release rights for Kinwall
# Releases go up as drafts (Play only takes drafts until the app's first release is reviewed);
# set the repository variable PLAY_RELEASE_STATUS to "completed" after that to roll out directly.
# The track is the repository variable PLAY_TRACK, else internal testing. Set it to the closed testing
# track's name (Play Console's track list; the first closed track is "alpha") to send releases straight
# to closed testers instead of promoting each one by hand.
# Version codes are minutes since 1970, as in scripts/play-bundle.sh, so CI and hand builds always go up.
#
# Three jobs, so the upload key never shares a machine with dependency code:
# check   Are the secrets set?
# build   Only optional Firebase client config, never signing/server keys. npm, Expo prebuild and Gradle build
#         the bundle unsigned (UNSIGNED=1), kept as a short-lived artifact.
# upload  No checkout and no npm. Signs the bundle with jarsigner (the upload key is written, used
#         and deleted within one step) and uploads it with the Play service account.
# The check and upload jobs use the "release" environment: with the secrets moved into it and its
# deployment branches limited to main and v* tags, a dispatch from any other branch can't read them.
name: Google Play
on:
  workflow_call:
    inputs:
      tag: { type: string, required: true }
    secrets:
      KINWALL_GOOGLE_SERVICES_JSON: { required: false }
      ANDROID_UPLOAD_KEYSTORE: { required: false }
      ANDROID_UPLOAD_PASSWORD: { required: false }
      PLAY_SERVICE_ACCOUNT_JSON: { required: false }
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload (vX.Y.Z). Empty to upload the chosen branch.
        type: string
        required: false
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  check:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      ready: ${{ steps.s.outputs.ready }}
    steps:
      - id: s
        env:
          KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          PASS: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$KEY" ] && [ -n "$PASS" ] && [ -n "$PLAY" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Google Play skipped: the upload key and Play secrets aren't set yet (see play.yml)"; fi

  build:
    needs: check
    if: ${{ needs.check.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ inputs.tag }}', persist-credentials: false }
      - name: Check the tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          if [ -n "$TAG" ] && [ "$TAG" != "v$v" ]; then echo "::error::tag $TAG but package.json says $v"; exit 1; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: npm ci --ignore-scripts # no dependency has an install script; this keeps it that way
      - name: Configure optional Android Firebase client
        env:
          KINWALL_GOOGLE_SERVICES_JSON: ${{ secrets.KINWALL_GOOGLE_SERVICES_JSON }}
        run: node scripts/android-firebase-ci.mjs
      - name: Build the bundle, unsigned
        env:
          UNSIGNED: '1'
          OUT: ${{ runner.temp }}/kinwall-unsigned.aab
          # Optional repository variable: the Cloud project NUMBER linked for Play Integrity turns on
          # the self-hosted push gateway (docs/CHORE-NOTIFICATIONS.md). Needs the Firebase secret too.
          KINWALL_PLAY_INTEGRITY_PROJECT_NUMBER: ${{ vars.KINWALL_PLAY_INTEGRITY_PROJECT_NUMBER }}
          NPM_CI: '0'
        run: scripts/play-bundle.sh
      - name: Remove Firebase client configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/google-services.json" android/app/google-services.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: aab-unsigned, path: '${{ runner.temp }}/kinwall-unsigned.aab', if-no-files-found: error, retention-days: 1 }

  upload:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions: {}
    steps:
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: aab-unsigned, path: '${{ runner.temp }}/in' }
      - name: Sign with the upload key
        env:
          KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          KINWALL_UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: |
          umask 077
          ks="$RUNNER_TEMP/upload.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEY" | base64 -d > "$ks"
          # Passwords go to jarsigner by environment variable name, never on the command line.
          jarsigner -keystore "$ks" -storepass:env KINWALL_UPLOAD_PASSWORD -keypass:env KINWALL_UPLOAD_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar "$RUNNER_TEMP/kinwall.aab" "$RUNNER_TEMP/in/kinwall-unsigned.aab" upload
          jarsigner -verify "$RUNNER_TEMP/kinwall.aab" | grep -q '^jar verified' || { echo "::error::the signed bundle didn't verify"; exit 1; }
      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: family.kinwall.app
          releaseFiles: ${{ runner.temp }}/kinwall.aab
          releaseName: ${{ inputs.tag || github.sha }}
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
