# release-please (release-please-config.json): keeps a "chore: release x.y.z" PR open with the
# next version and CHANGELOG.md from Conventional Commits on main. Merging it tags vX.Y.Z and makes
# the GitHub Release. A release made with GITHUB_TOKEN starts no other workflows, so the unsigned
# app builds are called from here (build.yml) and attached to it, and the TestFlight upload
# (testflight.yml) and the Google Play upload (play.yml), each skipped until its secrets are set,
# run beside them.
# Repo setting needed: Settings -> Actions -> General -> "Allow GitHub Actions to create and
# approve pull requests".
name: Release
on:
  push:
    branches: [main]
permissions: {}
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
  builds:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
  testflight:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/testflight.yml
    secrets: inherit
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
  play:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/play.yml
    secrets: inherit
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
