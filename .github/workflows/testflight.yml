# Signed iPhone/iPad build (with the widgets, share extension and Watch app) uploaded to App Store
# Connect for TestFlight (docs/PUBLISHING.md). Called by release-please.yml for each release, or run
# by hand: with a tag it uploads that release, without one the chosen branch.
# Skipped until these repository secrets exist (App Store Connect -> Users and Access ->
# Integrations -> App Store Connect API, a key with the Admin role so automatic signing can make
# certificates and profiles):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file's contents), APPLE_TEAM_ID
# They can live in the "release" environment (as play.yml's do): with its deployment branches
# limited to main and v* tags, a dispatch from any other branch can't read them.
# Build numbers: CFBundleVersion is "<major*10000 + minor*100 + patch>.<minutes since 1970>", the
# same rule as scripts/testflight.sh, so uploads from either always go up within a version.
name: TestFlight
on:
  workflow_call:
    inputs:
      tag: { type: string, required: true }
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload (vX.Y.Z). Empty to upload the chosen branch.
        type: string
        required: false
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  check:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      ready: ${{ steps.s.outputs.ready }}
    steps:
      - id: s
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$KEY" ] && [ -n "$TEAM" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::TestFlight skipped: the App Store Connect secrets aren't set yet (see testflight.yml)"; fi

  upload:
    needs: check
    if: ${{ needs.check.outputs.ready == 'true' }}
    # Xcode 26 or later: the iOS 17 deployment target, the widgets and the Watch app.
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      # Push stays off until the APNs setup in docs/PLAN.md ("Turning on Live Activity push").
      KINWALL_PUSH: '0'
    # The App Store Connect key (Admin) is written and put in the environment only for the archive
    # and upload steps, after npm and CocoaPods have installed, so their install code never sees it.
    # The archive step still runs build code from node_modules and Pods (the React Native bundling
    # and CocoaPods script phases) while the key file exists: xcodebuild signs while it builds, so
    # unlike play.yml this can't yet be split into an unsigned build and a separate signing job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ inputs.tag }}', persist-credentials: false }
      - name: Version and build number
        run: |
          v=$(node -p "require('./package.json').version")
          IFS=. read -r major minor patch <<< "$v"
          if [ -n "$TAG" ] && [ "$TAG" != "v$v" ]; then echo "::error::tag $TAG but package.json says $v"; exit 1; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "BUILD=$((major * 10000 + minor * 100 + patch)).$(( $(date -u +%s) / 60 ))" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts # no dependency has an install script; this keeps it that way
      - run: CI=1 npx expo prebuild --platform ios --clean --no-install
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pods-${{ runner.os }}-
      - run: xcodebuild -version && (xcodebuild -showsdks | grep -q watchos || xcodebuild -downloadPlatform watchOS)
      - run: pod install
        working-directory: ios
      - name: API key
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/asc.p8"
      - name: Archive, signed with the team (automatic signing through the API key)
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive -quiet -workspace ios/Kinwall.xcworkspace -scheme Kinwall -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Kinwall.xcarchive" -derivedDataPath "$RUNNER_TEMP/dd" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD"
      - name: Upload to App Store Connect
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Kinwall.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Kinwall $VERSION ($BUILD) uploaded; it shows in TestFlight once Apple has processed it (about 10-30 minutes)"
      - if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
