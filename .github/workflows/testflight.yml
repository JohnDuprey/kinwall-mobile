# Public TestFlight entry point. The Linux controller chooses one signed worker at a time.
name: TestFlight
on:
  workflow_call:
    inputs:
      tag: { type: string, required: true }
      runner: { type: string, default: auto, required: false }
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload (vX.Y.Z). Empty to upload the chosen branch.
        type: string
        required: false
      runner:
        description: ARM first with Intel fallback, or a specific runner.
        type: choice
        options: [auto, arm, intel]
        default: auto
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  check:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      ready: ${{ steps.s.outputs.ready }}
    steps:
      - id: s
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_P12: ${{ secrets.APPLE_SIGNING_P12_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.APPLE_SIGNING_P12_PASSWORD }}
        run: |
          if [ -n "$KEY" ] && [ -n "$TEAM" ] && { [ -z "$SIGNING_P12" ] || [ -z "$SIGNING_PASSWORD" ]; }; then
            echo "::error::Configure APPLE_SIGNING_P12_BASE64 and APPLE_SIGNING_P12_PASSWORD in the release environment. CI must reuse a signing identity instead of creating certificates on every run."
            exit 1
          fi
          if [ -n "$KEY" ] && [ -n "$TEAM" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::TestFlight skipped: the App Store Connect secrets aren't set yet (see testflight.yml)"; fi

  select-and-watch:
    needs: check
    if: ${{ needs.check.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Select a runner and watch the signed build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RUNNER_SELECTION: ${{ inputs.runner || 'auto' }}
        run: node scripts/testflight-fallback.mjs
      - name: Cancel this controller's unfinished workers
        if: ${{ cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/testflight-fallback.mjs --cancel
